# Built-from-source Everest reports itself as "0.0.0-dev", which its own
# dependency check always treats as satisfying any pin (Everest.Loader.
# VersionSatisfiesDependency special-cases installed major==minor==0), so
# this low placeholder is fine against install-everest.sh's output. Raise
# it only if you install a real numbered Everest release instead.
- Name: CelesteDashpad
  Version: 0.1.0
  DLL: bin/Debug/net8.0/CelesteDashpad.dll
  Dependencies:
    - Name: Everest
      Version: 1.0.0
